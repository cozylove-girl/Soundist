name: 功能建议
description: 描述一个真实场景和希望解决的问题
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在什么时间、地点或任务中需要它？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 现在是什么阻碍了体验？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 理想结果
      description: 描述完成后的体验，不必限定技术实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
