<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soundist 应用图标安全边距预览</title>
  <style>
    :root {
      --canvas: #070d10;
      --surface: #101a1b;
      --raised: #172322;
      --line: #314543;
      --text: #dde5e2;
      --muted: #9eaaa6;
      --accent: #44b9a5;
      --inset: 21px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(760px, 100%); margin: 0 auto; padding: 28px 20px 48px; }
    h1 { margin: 0; font-size: 21px; font-weight: 650; }
    .intro { margin: 6px 0 24px; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 18px;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    output { min-width: 52px; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hint { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; }
    .previews { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
    figure { margin: 0; text-align: center; }
    .stage {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      padding: 20px;
      background: #0b1315;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .adaptive {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      background: #172322;
      position: relative;
    }
    .adaptive.circle { border-radius: 50%; }
    .adaptive.squircle { border-radius: 30%; }
    .adaptive.square { border-radius: 0; }
    .safe {
      position: absolute;
      inset: var(--inset);
      outline: 1px dashed rgb(120 214 197 / 78%);
      pointer-events: none;
      z-index: 1;
    }
    .adaptive img { width: 100%; height: 100%; object-fit: fill; display: block; }
    .adaptive.inset-image img { position: absolute; inset: var(--inset); width: calc(100% - (var(--inset) * 2)); height: calc(100% - (var(--inset) * 2)); }
    .adaptive.inset-image .safe { inset: var(--inset); }
    .adaptive.direct-image .safe { display: none; }
    .mode-title { grid-column: 1 / -1; margin: 28px 0 -8px; color: var(--text); font-size: 14px; font-weight: 650; }
    .mode-title small { color: var(--muted); font-size: 12px; font-weight: 400; }
    figcaption { padding-top: 9px; font-size: 12px; color: var(--muted); }
    .code {
      margin-top: 28px;
      padding: 14px 16px;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre;
    }
    .code b { color: var(--accent); font-weight: 600; }
    @media (max-width: 560px) {
      main { padding: 20px 14px 36px; }
      .previews { gap: 10px; }
      .stage { padding: 8px; }
      figcaption { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>应用图标安全边距</h1>
    <p class="intro">拖动数值，观察同一前景在 Android 常见遮罩下留下多少呼吸空间。虚线是前景 bitmap 实际被缩放后的边界。</p>

    <section class="controls" aria-label="边距控制">
      <input id="inset" type="range" min="8" max="30" value="21" step="1" aria-label="图标边距">
      <output id="value" for="inset">21 dp</output>
      <p class="hint">目前工程值为 21dp。数值越小，主体越大；数值越大，留白越多。建议先在 16–20dp 之间找平衡。</p>
    </section>

    <section class="previews" aria-label="应用图标模式预览">
      <div class="mode-title">自适应图标 <small>前景图按 inset 缩进，系统再套用遮罩</small></div>
      <figure><div class="stage"><div class="adaptive square inset-image"><img src="soundist-icon-master.png" alt="自适应图标方形预览"><i class="safe"></i></div></div><figcaption>方形容器</figcaption></figure>
      <figure><div class="stage"><div class="adaptive squircle inset-image"><img src="soundist-icon-master.png" alt="自适应图标圆角方形预览"><i class="safe"></i></div></div><figcaption>圆角方形遮罩</figcaption></figure>
      <figure><div class="stage"><div class="adaptive circle inset-image"><img src="soundist-icon-master.png" alt="自适应图标圆形预览"><i class="safe"></i></div></div><figcaption>圆形遮罩</figcaption></figure>

      <div class="mode-title">传统图标 <small>整张原图直接作为图标，不额外 inset</small></div>
      <figure><div class="stage"><div class="adaptive square direct-image"><img src="soundist-icon-master.png" alt="传统图标方形预览"><i class="safe"></i></div></div><figcaption>方形容器</figcaption></figure>
      <figure><div class="stage"><div class="adaptive squircle direct-image"><img src="soundist-icon-master.png" alt="传统图标圆角方形预览"><i class="safe"></i></div></div><figcaption>圆角方形遮罩</figcaption></figure>
      <figure><div class="stage"><div class="adaptive circle direct-image"><img src="soundist-icon-master.png" alt="传统图标圆形预览"><i class="safe"></i></div></div><figcaption>圆形遮罩</figcaption></figure>
    </section>

    <div class="code">&lt;item android:top="<b id="codeValue">21dp</b>" android:bottom="<b class="code-inset">21dp</b>"
      android:left="<b class="code-inset">21dp</b>" android:right="<b class="code-inset">21dp</b>"&gt;</div>
  </main>
  <script>
    const slider = document.getElementById('inset');
    const output = document.getElementById('value');
    const codeValue = document.getElementById('codeValue');
    const codeInsets = document.querySelectorAll('.code-inset');
    const update = () => {
      const value = `${slider.value}dp`;
      document.documentElement.style.setProperty('--inset', `${slider.value}px`);
      output.value = value;
      output.textContent = value;
      codeValue.textContent = value;
      codeInsets.forEach((node) => { node.textContent = value; });
    };
    slider.addEventListener('input', update);
    update();
  </script>
</body>
</html>
